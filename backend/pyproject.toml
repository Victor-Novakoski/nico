[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nico"
version = "0.1.0"
description = "Backend do Nico: cálculo de faturas, parcelas e divisão por pessoa"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic", "psycopg[binary]", "psycopg-pool", "httpx", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
